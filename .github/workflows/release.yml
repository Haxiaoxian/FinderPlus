name: Release

# Builds a downloadable FinderPlus.dmg on an Apple Silicon runner and publishes it as the GitHub
# release "v<MARKETING_VERSION>" (from Config/Base.xcconfig). The release and its tag are created
# by this workflow; a later run for the same version replaces the DMG.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version && uname -m
      - name: Unit tests
        run: swift test --package-path Packages/FinderPlusKit
      - name: Build DMG (arm64, ad-hoc signed)
        run: scripts/make-dmg.sh
      - name: Read version
        id: version
        run: echo "value=$(sed -n 's/^MARKETING_VERSION *= *//p' Config/Base.xcconfig)" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinderPlus-arm64-dmg
          path: dist/*.dmg
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: FinderPlus ${{ steps.version.outputs.value }} (Apple Silicon)
          prerelease: true
          files: dist/*.dmg
          body_path: docs/INSTALL.md
