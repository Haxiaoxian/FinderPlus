name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package-tests:
    name: FinderPlusKit tests (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version && uname -m
      - name: Run unit tests
        run: swift test --package-path Packages/FinderPlusKit

  app-arm64:
    name: Build app (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project FinderPlus.xcodeproj -scheme FinderPlus -configuration Release \
            -destination 'generic/platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath build build
      - name: Check architecture
        run: lipo -archs build/Build/Products/Release/FinderPlus.app/Contents/MacOS/FinderPlus
      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: FinderPlus-arm64-unsigned
          path: build/Build/Products/Release/FinderPlus.app

  # Phase 2 — Intel support. Builds a Universal binary; kept non-blocking until Intel is verified.
  app-universal:
    name: Build app (Universal, phase 2)
    runs-on: macos-15
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - run: |
          xcodebuild -project FinderPlus.xcodeproj -scheme FinderPlus -configuration Release \
            -destination 'generic/platform=macOS' ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath build build
      - run: lipo -archs build/Build/Products/Release/FinderPlus.app/Contents/MacOS/FinderPlus
