name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          mkdir -p ci-logs
          { xcodebuild -version; swift --version; uname -m; } 2>&1 | tee ci-logs/toolchain.log
      - name: Unit tests
        run: |
          set -o pipefail
          FINDERPLUS_NETWORK_TESTS=1 swift test --package-path Packages/FinderPlusKit 2>&1 | tee ci-logs/tests.log
      - name: Build app (arm64)
        if: always()
        run: |
          set -o pipefail
          brew install xcodegen >/dev/null
          xcodegen generate 2>&1 | tee ci-logs/xcodegen.log
          xcodebuild -project FinderPlus.xcodeproj -scheme FinderPlus -configuration Release \
            -destination 'generic/platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= FP_ENTITLEMENTS_VARIANT=-AdHoc \
            -derivedDataPath build build 2>&1 | tee ci-logs/app.log
          lipo -archs build/Build/Products/Release/FinderPlus.app/Contents/MacOS/FinderPlus
          # The PDF helper is embedded, and WebKit is linked by the helper only, never by the host.
          APP=build/Build/Products/Release/FinderPlus.app
          otool -L "$APP/Contents/MacOS/FinderPlus" | tee ci-logs/host-libraries.log
          test -x "$APP/Contents/MacOS/FinderPlusPDFRenderer"
          ! grep -q WebKit.framework ci-logs/host-libraries.log
          codesign --verify --deep --strict "$APP"
          # FinderPlus must launch as an agent (no Dock icon when Finder wakes it).
          test "$(/usr/libexec/PlistBuddy -c 'Print LSUIElement' build/Build/Products/Release/FinderPlus.app/Contents/Info.plist)" = "true"
      - name: Summarize errors
        if: always()
        run: |
          grep -hE "(error|warning: unreachable|fatal error):" ci-logs/*.log | sort -u > ci-logs/errors.txt || true
          grep -hE "^(Test Case .* failed|.*XCTAssert.*failed)" ci-logs/tests.log | sort -u > ci-logs/test-failures.txt || true
          head -40 ci-logs/errors.txt | while IFS= read -r line; do echo "::error::$line"; done
      - name: Publish logs to ci-logs branch
        if: always()
        run: |
          cd ci-logs
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Logs for run ${{ github.run_id }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
